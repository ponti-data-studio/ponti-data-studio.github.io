<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="VASPRA (Cek Plot) — sistem pengajuan validasi spasial / pra surat ukur online: kirim berkas, dapatkan nomor berkas otomatis, dan unduh hasil produk, tersinkron langsung dengan Google Sheets.">

<!-- Open Graph / pratinjau tautan -->
<meta property="og:type" content="website">
<meta property="og:title" content="VASPRA (Cek Plot)">
<meta property="og:description" content="Pengajuan validasi spasial / pra surat ukur online dengan nomor berkas otomatis, bisa dipasang di HP dan desktop.">
<meta property="og:image" content="./icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">

<title>VASPRA (Cek Plot)</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">

<!-- PWA: manifest -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E3B2E">

<!-- PWA: Android / Chrome / Windows install -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="VASPRA">

<!-- PWA: iOS (Add to Home Screen) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VASPRA">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0E1C29}
  iframe{width:100%;height:100%;border:none;display:block;background:#0E1C29}

  /* ------------------------------ SPLASH ----------------------------- */
  #splash{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:#0E1C29;
    transition:opacity .35s ease;
  }
  #splash.hide{opacity:0;pointer-events:none}
  #splash .mark{
    width:72px;height:72px;border-radius:16px;
    background:linear-gradient(135deg,#0E3B2E,#145C46);
    border:2px solid rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;
    color:#F2B705;font-weight:700;font-size:22px;letter-spacing:.04em;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    animation:pulse 1.6s ease-in-out infinite;
    box-shadow:0 8px 24px rgba(14,59,46,.5);
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #splash .brand{
    color:#9FB2A9;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #splash .dots{display:flex;gap:6px}
  #splash .dots span{
    width:6px;height:6px;border-radius:50%;background:#145C46;
    animation:blink 1.2s infinite ease-in-out;
  }
  #splash .dots span:nth-child(2){animation-delay:.15s;background:#F2B705}
  #splash .dots span:nth-child(3){animation-delay:.3s;background:#145C46}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #splash .mark{animation:none}
    #splash .dots span{animation:none;opacity:.7}
  }

  /* ------------------------------ OFFLINE ----------------------------- */
  #offlineBar{
    position:fixed;left:0;right:0;top:0;z-index:60;display:none;
    align-items:center;gap:10px;padding:10px 14px;
    background:#F2B705;color:#2B2306;font-size:13px;font-weight:500;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  #offlineBar.show{display:flex}
  #offlineBar button{
    margin-left:auto;border:1px solid rgba(0,0,0,.25);background:transparent;
    color:#2B2306;padding:5px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;
  }

  /* ---------------------------- POPUP PASANG APLIKASI --------------------------- */
  /* Popup ajakan memasang muncul sekali (dengan jeda cooldown), bukan tombol
     melayang permanen — supaya tidak mengganggu tampilan aplikasi. */
  #installModal{
    position:fixed;inset:0;z-index:70;display:none;
    align-items:flex-end;justify-content:center;
  }
  #installModal.show{display:flex}
  .install-backdrop{position:absolute;inset:0;background:rgba(6,14,10,.6)}
  .install-card{
    position:relative;z-index:1;width:100%;max-width:420px;
    margin:0 auto calc(16px + env(safe-area-inset-bottom));
    background:#123527;color:#E7F2EC;border-radius:16px 16px 0 0;
    padding:20px 20px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(0,0,0,.4);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    animation:installSlideUp .25s ease;
  }
  @keyframes installSlideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media (min-width:560px){
    #installModal{align-items:center}
    .install-card{border-radius:16px;margin:0;animation:installPopIn .2s ease}
  }
  @keyframes installPopIn{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .install-icon{
    width:56px;height:56px;border-radius:14px;overflow:hidden;margin-bottom:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.3)
  }
  .install-icon img{width:100%;height:100%;display:block}
  .install-card h3{font-size:17px;margin-bottom:6px;color:#fff}
  .install-card p{font-size:13.5px;line-height:1.6;color:#C7D9CF;margin-bottom:18px}
  .install-actions{display:flex;gap:10px}
  .install-actions button{
    flex:1;border:0;border-radius:8px;padding:11px 14px;font-size:13.5px;
    font-weight:600;cursor:pointer;font-family:inherit
  }
  #installLater{background:rgba(255,255,255,.08);color:#C7D9CF}
  #installConfirm{background:#F2B705;color:#2B2306}
</style>
</head>
<body>

  <div id="offlineBar" role="status">
    Tidak ada koneksi internet. Sebagian data mungkin tidak termuat.
    <button id="offlineRetry">Coba lagi</button>
  </div>

  <div id="splash">
    <div class="mark">VP</div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="brand">Menyiapkan VASPRA</div>
  </div>

  <!--
    PENTING — SEBELUM DI-HOST:
    Ganti nilai src di bawah dengan URL Web App hasil Deploy Anda sendiri
    (Apps Script editor → Deploy → Manage deployments → salin "Web app URL").
    URL harus diakhiri "/exec", bukan "/dev".
  -->
  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbx-F2BigXq2PhZfaApY9yhqVFCLJJMlSxa0xrFHlEyLJeAaK1ZztPxlnxX-eORvwOVS/exec?page=customer"
    title="VASPRA (Cek Plot)"
    allow="geolocation; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <div id="installModal" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <div class="install-backdrop" id="installBackdrop"></div>
    <div class="install-card">
      <div class="install-icon"><img src="./icons/icon-192.png" alt=""></div>
      <h3 id="installTitle">Pasang VASPRA?</h3>
      <p id="installText">Pasang aplikasi ini di perangkat Anda untuk akses lebih cepat, tampilan layar penuh, dan ikon di layar utama.</p>
      <div class="install-actions">
        <button id="installLater" type="button">Nanti saja</button>
        <button id="installConfirm" type="button">Pasang Aplikasi</button>
      </div>
    </div>
  </div>

<script>
  /* ------------------------------ SPLASH ------------------------------ */
  var splash = document.getElementById('splash');
  var frame = document.getElementById('app');
  var splashHidden = false;

  function hideSplash() {
    if (splashHidden) return;
    splashHidden = true;
    splash.classList.add('hide');
    setTimeout(function () { splash.remove(); }, 400);
  }
  frame.addEventListener('load', hideSplash);
  // Jaring pengaman: kalau iframe lambat/gagal memicu 'load', jangan biarkan
  // splash menutupi aplikasi selamanya.
  setTimeout(hideSplash, 6000);

  /* ------------------------------ OFFLINE ------------------------------ */
  var offlineBar = document.getElementById('offlineBar');
  function syncOnlineState() {
    offlineBar.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', syncOnlineState);
  window.addEventListener('offline', syncOnlineState);
  document.getElementById('offlineRetry').addEventListener('click', function () {
    frame.src = frame.src; // muat ulang iframe
    syncOnlineState();
  });
  syncOnlineState();

  /* --------------------------- SERVICE WORKER --------------------------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('Pendaftaran service worker gagal:', err);
      });
    });
  }

  /* --------------------------- POPUP PASANG APLIKASI --------------------------- */
  // Sudah berjalan sebagai app terpasang (standalone) -> jangan pernah tampilkan popup.
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS 13+

  var installModal = document.getElementById('installModal');
  var installText = document.getElementById('installText');
  var installConfirm = document.getElementById('installConfirm');
  var installLater = document.getElementById('installLater');
  var installBackdrop = document.getElementById('installBackdrop');
  var deferredPrompt = null;

  var DISMISS_KEY = 'vaspra_install_dismissed_at';
  var DISMISS_COOLDOWN_MS = 3 * 24 * 60 * 60 * 1000; // jangan tampilkan lagi selama 3 hari setelah ditutup

  function shouldShowInstallPopup() {
    if (isStandalone) return false;
    var raw = null;
    try { raw = localStorage.getItem(DISMISS_KEY); } catch (e) {}
    if (!raw) return true;
    var last = parseInt(raw, 10);
    return !last || (Date.now() - last) > DISMISS_COOLDOWN_MS;
  }
  function rememberDismiss() {
    try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch (e) {}
  }
  function closeInstallModal() {
    installModal.classList.remove('show');
    rememberDismiss();
  }
  function openInstallModal(mode) {
    if (mode === 'ios') {
      installText.innerHTML = 'Ketuk ikon <b>Bagikan</b> (kotak dengan panah ke atas) di Safari, lalu pilih ' +
        '<b>"Tambahkan ke Layar Utama"</b> untuk memasang VASPRA di perangkat Anda.';
      installConfirm.textContent = 'Mengerti';
      installConfirm.onclick = closeInstallModal;
    } else {
      installText.textContent = 'Pasang aplikasi ini di perangkat Anda untuk akses lebih cepat, tampilan layar penuh, dan ikon di layar utama.';
      installConfirm.textContent = 'Pasang Aplikasi';
      installConfirm.onclick = function () {
        installModal.classList.remove('show');
        rememberDismiss();
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () { deferredPrompt = null; });
      };
    }
    installModal.classList.add('show');
  }
  installLater.addEventListener('click', closeInstallModal);
  installBackdrop.addEventListener('click', closeInstallModal);

  // Android/Chrome/Edge: tangkap event resmi lalu tampilkan popup (bukan tombol).
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (shouldShowInstallPopup()) {
      setTimeout(function () { openInstallModal('android'); }, 1500);
    }
  });
  window.addEventListener('appinstalled', function () {
    installModal.classList.remove('show');
    rememberDismiss(); // sudah terpasang, tidak perlu menawarkan lagi
  });

  // iOS Safari tidak mendukung beforeinstallprompt -> tampilkan popup berisi
  // instruksi manual "Tambahkan ke Layar Utama".
  if (isIOS && shouldShowInstallPopup()) {
    setTimeout(function () { openInstallModal('ios'); }, 1500);
  }

</script>
</body>
</html>
