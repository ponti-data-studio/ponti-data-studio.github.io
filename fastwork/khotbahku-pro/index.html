<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Khotbah Pro — Penyusun khotbah dengan AI dan teleprompter mimbar, tersinkron dengan Google Sheets.">

<!-- Open Graph / pratinjau tautan -->
<meta property="og:type" content="website">
<meta property="og:title" content="Khotbah Pro — Penyusun Khotbah AI & Teleprompter Mimbar">
<meta property="og:description" content="Susun naskah khotbah dengan AI dan sampaikan dari mimbar dengan teleprompter, langsung dari HP.">
<meta property="og:image" content="./icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">

<title>Khotbah Pro</title>

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">

<!-- PWA: manifest -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4F46E5">

<!-- PWA: Android / Chrome / Windows install -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Khotbah Pro">

<!-- PWA: iOS (Add to Home Screen) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Khotbah Pro">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#F8FAFC}
  iframe{width:100%;height:100%;border:none;display:block;background:#F8FAFC}

  /* ------------------------------ SPLASH ----------------------------- */
  #splash{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:#F8FAFC;
    transition:opacity .35s ease;
  }
  #splash.hide{opacity:0;pointer-events:none}
  #splash .mark{
    width:72px;height:72px;border-radius:18px;
    background:#4F46E5;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:24px;letter-spacing:.02em;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    box-shadow:0 12px 24px rgba(79,70,229,.28);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #splash .brand{
    color:#64748B;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #splash .dots{display:flex;gap:6px}
  #splash .dots span{
    width:6px;height:6px;border-radius:50%;background:#4F46E5;
    animation:blink 1.2s infinite ease-in-out;
  }
  #splash .dots span:nth-child(2){animation-delay:.15s;background:#A5B4FC}
  #splash .dots span:nth-child(3){animation-delay:.3s;background:#4F46E5}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #splash .mark{animation:none}
    #splash .dots span{animation:none;opacity:.7}
  }

  /* ------------------------------ OFFLINE ----------------------------- */
  #offlineBar{
    position:fixed;left:0;right:0;top:0;z-index:60;display:none;
    align-items:center;gap:10px;padding:10px 14px;
    background:#B4770B;color:#2A1B00;font-size:13px;font-weight:500;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  #offlineBar.show{display:flex}
  #offlineBar button{
    margin-left:auto;border:1px solid rgba(0,0,0,.25);background:transparent;
    color:#2A1B00;padding:5px 10px;border-radius:6px;font-size:12.5px;cursor:pointer;
  }

  /* ---------------------------- INSTALL FAB --------------------------- */
  #installBtn{
    position:fixed;right:16px;bottom:16px;z-index:55;display:none;
    align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:0;
    background:#4F46E5;color:#fff;font-weight:600;font-size:13.5px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    box-shadow:0 8px 20px rgba(79,70,229,.35);cursor:pointer;
  }
  #installBtn.show{display:flex}
  #installBtn svg{width:16px;height:16px}
  #installBtn.installed{display:none!important}

  @supports (bottom: env(safe-area-inset-bottom)){
    #installBtn{bottom:calc(16px + env(safe-area-inset-bottom))}
  }

  /* ------------------------- SETUP NOTICE (dev only) ------------------- */
  #setupNotice{
    position:fixed;inset:0;z-index:70;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:#F8FAFC;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #setupNotice.show{display:flex}
  #setupNotice .box{
    max-width:420px;background:#fff;border:1px solid #E2E8F0;border-radius:20px;
    padding:24px;text-align:center;
  }
  #setupNotice h1{font-size:16px;color:#0F172A;margin-bottom:8px}
  #setupNotice p{font-size:13.5px;color:#64748B;line-height:1.6}
  #setupNotice code{
    display:block;margin-top:12px;padding:10px 12px;background:#F1F5F9;
    border-radius:10px;font-size:12px;color:#4338CA;word-break:break-all;
    text-align:left;
  }
</style>
</head>
<body>

  <div id="offlineBar" role="status">
    Tidak ada koneksi internet. Sebagian data mungkin tidak termuat.
    <button id="offlineRetry">Coba lagi</button>
  </div>

  <div id="splash">
    <div class="mark">KP</div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="brand">Menyiapkan Khotbah Pro</div>
  </div>

  <div id="setupNotice">
    <div class="box">
      <h1>Satu langkah lagi</h1>
      <p>Ganti nilai <strong>APP_URL</strong> di bagian atas file <code>index.html</code> ini dengan URL Web App Apps Script kamu (dari menu Deploy → Manage deployments).</p>
      <code id="setupNoticeUrl"></code>
    </div>
  </div>

  <iframe
    id="app"
    src=""
    title="Khotbah Pro — Penyusun Khotbah AI & Teleprompter Mimbar"
    allow="clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <button id="installBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
    Pasang aplikasi
  </button>

<script>
  /* --------------------------- URL WEB APP GAS --------------------------- */
  // Ganti baris ini dengan URL hasil Deploy → Web app di Apps Script,
  // formatnya: https://script.google.com/macros/s/AKfycb.../exec
  var APP_URL = 'https://script.google.com/macros/s/AKfycby2CBjMr_z5Ty7fcLhULXbopXzEPcQnRUmL9ms1veWiYndkCe3l8kyPNIbPZlUcTT6Q/exec';

  var frame = document.getElementById('app');
  var setupNotice = document.getElementById('setupNotice');
  var splash = document.getElementById('splash');

  if (!APP_URL || APP_URL.indexOf('REPLACE_WITH') === 0) {
    document.getElementById('setupNoticeUrl').textContent =
      "var APP_URL = 'https://script.google.com/macros/s/AKfycbxxxxxxxx/exec';";
    setupNotice.classList.add('show');
    splash.classList.add('hide');
  } else {
    frame.src = APP_URL;
  }

  /* ------------------------------ SPLASH ------------------------------ */
  var splashHidden = false;
  function hideSplash() {
    if (splashHidden) return;
    splashHidden = true;
    splash.classList.add('hide');
    setTimeout(function () { splash.remove(); }, 400);
  }
  frame.addEventListener('load', hideSplash);
  // Jaring pengaman: kalau iframe lambat/gagal memicu 'load', jangan biarkan
  // splash menutupi aplikasi selamanya.
  setTimeout(hideSplash, 6000);

  /* ------------------------------ OFFLINE ------------------------------ */
  var offlineBar = document.getElementById('offlineBar');
  function syncOnlineState() {
    offlineBar.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', syncOnlineState);
  window.addEventListener('offline', syncOnlineState);
  document.getElementById('offlineRetry').addEventListener('click', function () {
    if (frame.src) frame.src = frame.src; // muat ulang iframe
    syncOnlineState();
  });
  syncOnlineState();

  /* --------------------------- SERVICE WORKER --------------------------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('Pendaftaran service worker gagal:', err);
      });
    });
  }

  /* ------------------------- TOMBOL PASANG APLIKASI ---------------------- */
  var installBtn = document.getElementById('installBtn');
  var deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });

  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    installBtn.classList.remove('show');
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function () { deferredPrompt = null; });
  });

  window.addEventListener('appinstalled', function () {
    installBtn.classList.remove('show');
    installBtn.classList.add('installed');
  });

  // Sudah berjalan sebagai app terpasang (standalone) -> jangan tampilkan tombol.
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
    installBtn.classList.add('installed');
  }
</script>
</body>
</html>
