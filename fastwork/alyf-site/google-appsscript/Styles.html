<style>
  :root{
    --ink:#0b0b0b; --paper:#f7f5ef; --white:#ffffff; --muted:#726d66;
    --gold:#b59657; --gold-soft:#d2bc8b; --line:rgba(11,11,11,.12);
    --danger:#b5433f; --success:#4c7a5b; --sidebar-w:250px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"DM Sans",Arial,sans-serif;color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:-.01em}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit}
  .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--gold);font-weight:600}

  /* ---------- LAYOUT ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:var(--sidebar-w);background:var(--ink);color:white;flex-shrink:0;
    display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;
    transition:transform .3s ease;
  }
  .sidebar-brand{padding:32px 26px 22px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sidebar-brand .main{font-size:26px;letter-spacing:.3em;margin-left:.3em}
  .sidebar-brand .sub{display:block;font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.55;margin-top:8px}
  .nav-list{list-style:none;padding:18px 12px;flex:1;overflow-y:auto}
  .nav-list a{
    display:flex;align-items:center;gap:12px;padding:13px 14px;font-size:12.5px;
    letter-spacing:.03em;color:rgba(255,255,255,.68);border-left:2px solid transparent;
    min-height:44px;
  }
  .nav-list a:hover{color:white;background:rgba(255,255,255,.04)}
  .nav-list a.active{color:var(--gold-soft);border-left-color:var(--gold);background:rgba(255,255,255,.05)}
  .sidebar-foot{padding:16px;border-top:1px solid rgba(255,255,255,.1)}
  .logout-btn{
    width:100%;background:transparent;border:1px solid rgba(255,255,255,.25);color:white;
    padding:12px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;min-height:44px;
  }
  .logout-btn:hover{border-color:var(--gold);color:var(--gold-soft)}

  .main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:none;align-items:center;justify-content:space-between;background:var(--ink);color:white;
    padding:0 18px;height:60px;position:sticky;top:0;z-index:150;
  }
  .topbar .main-word{font-family:"Cormorant Garamond";font-size:20px;letter-spacing:.24em;margin-left:.24em}
  .menu-toggle{background:none;border:0;color:white;font-size:22px}
  .content{padding:44px 48px 80px;max-width:1180px;width:100%}

  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:34px;flex-wrap:wrap}
  .page-head h2{font-size:34px}
  .page-head p{color:var(--muted);font-size:13.5px;margin-top:6px;max-width:560px}

  /* ---------- CARDS / GRID ---------- */
  .card{background:white;border:1px solid var(--line);padding:28px}
  .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
  .summary-card{background:white;border:1px solid var(--line);padding:26px 24px}
  .summary-card strong{display:block;font-family:"Cormorant Garamond";font-size:40px;margin-bottom:6px}
  .summary-card span{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

  .section-block{background:white;border:1px solid var(--line);padding:30px;margin-bottom:22px}
  .section-block h3{font-size:22px;margin-bottom:4px}
  .section-block .desc{font-size:12.5px;color:var(--muted);margin-bottom:20px}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin-bottom:18px}
  .field-row.single{grid-template-columns:1fr}
  .field{display:flex;flex-direction:column;gap:7px}
  .field.full{grid-column:1/-1}
  .field label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .field input[type=text],.field input[type=url],.field input[type=email],.field input[type=number],.field textarea,.field select{
    border:1px solid var(--line);padding:11px 12px;background:var(--paper);outline:none;font-size:13.5px;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}
  .field textarea{min-height:88px;resize:vertical}
  .hint{font-size:10.5px;color:#9a958c;margin-top:2px}

  .toggle-row{display:flex;align-items:center;gap:10px;font-size:12px}
  .switch{position:relative;width:38px;height:22px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#d8d3c8;transition:.2s;cursor:pointer;border-radius:20px}
  .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}
  input:checked + .slider{background:var(--gold)}
  input:checked + .slider:before{transform:translateX(16px)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;
    padding:0 20px;border:1px solid var(--ink);text-transform:uppercase;letter-spacing:.1em;
    font-size:11px;font-weight:600;background:transparent;transition:.2s;
  }
  .btn:hover{background:var(--ink);color:white}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
  .btn-gold:hover{background:var(--gold-soft);border-color:var(--gold-soft)}
  .btn-danger{border-color:var(--danger);color:var(--danger)}
  .btn-danger:hover{background:var(--danger);color:white}
  .btn-ghost{border-color:var(--line);color:var(--muted)}
  .btn-ghost:hover{background:var(--line);color:var(--ink)}
  .btn-sm{min-height:36px;padding:0 14px;font-size:10px}
  .btn[disabled]{opacity:.5;cursor:not-allowed;pointer-events:none}

  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

  /* ---------- IMAGE UPLOAD ---------- */
  .image-field{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .image-preview{
    width:180px;height:120px;background:#e9e5dd;border:1px solid var(--line);overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;
  }
  .image-preview img{width:100%;height:100%;object-fit:cover;display:block}
  .image-preview .placeholder{font-size:10px;color:#a39d92;text-transform:uppercase;letter-spacing:.1em}
  .dropzone{
    flex:1;min-width:220px;border:1.5px dashed var(--line);padding:20px;text-align:center;
    font-size:12px;color:var(--muted);cursor:pointer;transition:.2s;
  }
  .dropzone:hover,.dropzone.dragover{border-color:var(--gold);color:var(--ink);background:rgba(181,150,87,.05)}
  .dropzone input{display:none}
  .upload-meta{font-size:11px;color:var(--muted);margin-top:8px}
  .upload-error{font-size:11.5px;color:var(--danger);margin-top:8px}

  /* ---------- MEDIA LIBRARY ---------- */
  .media-toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .media-toolbar input,.media-toolbar select{border:1px solid var(--line);padding:10px 12px;background:white;font-size:12.5px}
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .media-card{background:white;border:1px solid var(--line)}
  .media-card .thumb{height:140px;background:#e9e5dd;overflow:hidden}
  .media-card .thumb img{width:100%;height:100%;object-fit:cover}
  .media-card .info{padding:14px}
  .media-card .info .fn{font-size:12px;font-weight:600;word-break:break-all}
  .media-card .info .meta{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .badge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;background:var(--paper);border:1px solid var(--line);margin-top:6px}
  .badge.in-use{border-color:var(--gold);color:#8a6f3f}

  /* ---------- TABLE (audit log) ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  tr:last-child td{border-bottom:0}
  .activity-item{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .activity-item:last-child{border-bottom:0}
  .activity-item .who{font-weight:600}
  .activity-item .when{color:var(--muted);font-size:11px;white-space:nowrap}

  .list-item{
    border:1px solid var(--line);padding:20px;margin-bottom:14px;background:var(--paper);
  }
  .list-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .drag-handle{cursor:grab;color:#aaa;font-size:16px}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
  .loading-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}

  .toast-anchor{position:fixed;top:20px;right:20px;z-index:9999}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:980px){
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0}
    .topbar{display:flex}
    .content{padding:28px 20px 60px}
    .summary-grid{grid-template-columns:1fr 1fr}
    .field-row{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .summary-grid{grid-template-columns:1fr}
    .page-head h2{font-size:28px}
    .media-toolbar{flex-direction:column}
  }
</style>
