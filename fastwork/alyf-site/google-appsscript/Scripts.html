<script>
/* =========================================================================
   ALYF CMS — Admin client application
   Talks to the Apps Script backend exclusively via google.script.run.
   Every privileged call sends the session token; the SERVER re-validates
   it on every request (see requireAuth_ in Auth.gs) — the client never
   assumes a button being visible means the action is authorized.
   ========================================================================= */

const TOKEN_KEY = 'alyf_cms_token';
const USER_KEY = 'alyf_cms_user';
const MAX_UPLOAD_SIZE = 5 * 1024 * 1024;
const ALLOWED_EXT = ['jpg', 'jpeg', 'png', 'webp'];
const ALLOWED_MIME = ['image/jpeg', 'image/png', 'image/webp'];

let CURRENT_USER = null;
let SESSION_TIMER = null;

function getToken() { return sessionStorage.getItem(TOKEN_KEY); }

/** Promise wrapper around google.script.run for a given server function name. */
function gsRun(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => resolve(res))
      .withFailureHandler(err => reject(err))
      [fnName](...args);
  });
}

function toast(icon, title) {
  Swal.mixin({
    toast: true, position: 'top-end', showConfirmButton: false, timer: 2600, timerProgressBar: true
  }).fire({ icon, title });
}

function confirmDialog(opts) {
  return Swal.fire({
    icon: opts.icon || 'warning',
    title: opts.title || 'Are you sure?',
    text: opts.text || '',
    showCancelButton: true,
    confirmButtonText: opts.confirmText || 'Confirm',
    cancelButtonText: 'Cancel',
    confirmButtonColor: '#0b0b0b',
    reverseButtons: true
  }).then(r => r.isConfirmed);
}

function loadingDialog(title) {
  Swal.fire({
    title: title || 'Saving…',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });
}

function handleApiResult(res, successMessage) {
  Swal.close();
  if (!res) { toast('error', 'Something went wrong. Please try again.'); return false; }
  if (res.success) {
    if (successMessage !== false) toast('success', successMessage || res.message || 'Changes published successfully.');
    return true;
  }
  if (res.errorCode === 'SESSION_EXPIRED' || res.errorCode === 'UNAUTHORIZED') {
    toast('error', 'Your session has expired. Please sign in again.');
    setTimeout(logout, 1200);
  } else {
    toast('error', res.message || 'Something went wrong.');
  }
  return false;
}

// ---------- BOOTSTRAP ----------

document.addEventListener('DOMContentLoaded', init);

async function init() {
  const token = getToken();
  if (!token) return goToLogin();

  try {
    const res = await gsRun('validateSession', token);
    if (!res || !res.success) return goToLogin();
    CURRENT_USER = res.data.user;
  } catch (e) {
    return goToLogin();
  }

  document.getElementById('app').style.display = 'flex';
  bindChrome();
  window.addEventListener('hashchange', () => renderRoute(currentRoute()));
  renderRoute(currentRoute());

  // Keep the session sliding while the tab is active.
  SESSION_TIMER = setInterval(async () => {
    const r = await gsRun('validateSession', getToken()).catch(() => null);
    if (!r || !r.success) { clearInterval(SESSION_TIMER); goToLogin(); }
  }, 4 * 60 * 1000);
}

function goToLogin() {
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(USER_KEY);
  window.location.href = '?route=login';
}

async function logout() {
  const token = getToken();
  try { await gsRun('logout', token); } catch (e) {}
  goToLogin();
}

function bindChrome() {
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const ok = await confirmDialog({ title: 'Sign out?', confirmText: 'Sign Out', icon: 'question' });
    if (ok) logout();
  });
  document.getElementById('menuToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
  document.getElementById('content').addEventListener('click', (e) => {
    if (window.innerWidth <= 980 && e.target.closest('#content')) {
      document.getElementById('sidebar').classList.remove('open');
    }
  });
}

function currentRoute() {
  return (window.location.hash || '#dashboard').replace('#', '') || 'dashboard';
}

function setActiveNav(route) {
  document.querySelectorAll('#navList a').forEach(a => {
    a.classList.toggle('active', a.dataset.route === route);
  });
  document.getElementById('sidebar').classList.remove('open');
}

const ROUTE_RENDERERS = {
  dashboard: renderDashboard,
  homepage: renderHomepage,
  collections: renderCollections,
  experience: renderExperience,
  amenities: renderAmenities,
  media: renderMedia,
  settings: renderSettings,
  audit: renderAudit
};

function renderRoute(route) {
  setActiveNav(route);
  const fn = ROUTE_RENDERERS[route] || renderDashboard;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading-state">Loading content…</div>';
  fn(content).catch(err => {
    console.error(err);
    content.innerHTML = '<div class="empty-state">Something went wrong loading this page. Please refresh.</div>';
  });
}

// ---------- HTML ESCAPE (defense in depth even though server sanitizes) ----------

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// DASHBOARD

async function renderDashboard(root) {
  const res = await gsRun('getDashboardData', getToken());
  if (!handleApiResult(res, false)) { root.innerHTML = '<div class="empty-state">Unable to load dashboard.</div>'; return; }
  const s = res.data.summary;
  const activity = res.data.recentActivity;

  root.innerHTML = `
    <div class="page-head">
      <div><h2>Dashboard</h2><p>Welcome back, ${esc(CURRENT_USER.name || CURRENT_USER.username)}. Here's what's happening on alyf.site.</p></div>
    </div>
    <div class="summary-grid">
      <div class="summary-card"><strong>${s.publishedContent}</strong><span>Published Content</span></div>
      <div class="summary-card"><strong>${s.totalImages}</strong><span>Total Images</span></div>
      <div class="summary-card"><strong>${s.activeCollections}</strong><span>Active Collections</span></div>
      <div class="summary-card"><strong>${esc(s.lastUpdated)}</strong><span>Last Updated</span></div>
    </div>
    <div class="section-block">
      <h3>Recent Activity</h3>
      <div class="desc">The latest changes made across the CMS.</div>
      <div id="activityList">
        ${activity.length ? activity.map(a => `
          <div class="activity-item">
            <div><span class="who">${esc(a.user)}</span> — ${esc(a.action)} <span style="color:#a39d92">·</span> ${esc(a.module)}${a.description ? ' — ' + esc(a.description) : ''}</div>
            <div class="when">${esc(formatTimestamp(a.timestamp))}</div>
          </div>
        `).join('') : '<div class="empty-state">No activity recorded yet.</div>'}
      </div>
    </div>
  `;
}

function formatTimestamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString(undefined, { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// =========================================================================
// IMAGE UPLOADER COMPONENT
// Renders a preview + dropzone, validates client-side, converts to base64,
// and calls the provided upload/replace handler. Purely additive — never
// touches other fields until the user explicitly saves the rest of a form.
// =========================================================================

function imageFieldHtml(fieldId, currentUrl, altLabel) {
  return `
    <div class="image-field" id="${fieldId}_wrap">
      <div class="image-preview" id="${fieldId}_preview">
        ${currentUrl ? `<img src="${esc(currentUrl)}" alt="${esc(altLabel || '')}">` : '<span class="placeholder">No image</span>'}
      </div>
      <div style="flex:1;min-width:220px">
        <label class="dropzone" id="${fieldId}_dropzone">
          <strong>Drag &amp; drop image</strong><br>or click to choose a file
          <input type="file" id="${fieldId}_input" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" />
        </label>
        <div class="upload-meta" id="${fieldId}_meta"></div>
        <div class="upload-error" id="${fieldId}_error" style="display:none"></div>
      </div>
    </div>
  `;
}

/**
 * Wires up an image field. `onFileReady(fileInfo)` is called once a file
 * passes client-side validation, with { base64, mimeType, sizeBytes, previewUrl }.
 * Actual upload to Drive happens only when the caller invokes doUpload().
 */
function bindImageField(fieldId, onFileReady) {
  const dropzone = document.getElementById(fieldId + '_dropzone');
  const input = document.getElementById(fieldId + '_input');
  const errorEl = document.getElementById(fieldId + '_error');
  const metaEl = document.getElementById(fieldId + '_meta');
  const previewEl = document.getElementById(fieldId + '_preview');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    metaEl.textContent = '';
  }

  function handleFile(file) {
    errorEl.style.display = 'none';
    if (!file) return;

    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ALLOWED_EXT.indexOf(ext) === -1 || ALLOWED_MIME.indexOf(file.type) === -1) {
      showError('Image must be JPG, JPEG, PNG, or WEBP.');
      return;
    }
    if (file.size > MAX_UPLOAD_SIZE) {
      showError('Maximum file size is 5 MB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(',')[1];
      previewEl.innerHTML = `<img src="${dataUrl}" alt="">`;
      metaEl.textContent = `✓ ${file.name} · ${(file.size / (1024 * 1024)).toFixed(2)} MB · ${ext.toUpperCase()}`;
      onFileReady({ base64, mimeType: file.type, sizeBytes: file.size, previewUrl: dataUrl, filename: file.name });
    };
    reader.onerror = () => showError('Could not read that file. Please try another image.');
    reader.readAsDataURL(file);
  }

  dropzone.addEventListener('click', (e) => { if (e.target !== input) input.click(); });
  input.addEventListener('change', () => handleFile(input.files[0]));
  ['dragover', 'dragenter'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
  dropzone.addEventListener('drop', (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
}

// =========================================================================
// HOMEPAGE — Hero, Intro, Footer (key/value CONTENT rows) + Why ALYF (Features)
// =========================================================================

let HOMEPAGE_DATA = null;
const PENDING_UPLOADS = {}; // fieldId -> {base64,mimeType,sizeBytes}

function getContentValue(section, key) {
  const row = (HOMEPAGE_DATA.content || []).find(c => c.section === section && c.content_key === key);
  return row || null;
}

async function renderHomepage(root) {
  const res = await gsRun('getHomepageContent', getToken());
  if (!handleApiResult(res, false)) { root.innerHTML = '<div class="empty-state">Unable to load homepage content.</div>'; return; }
  HOMEPAGE_DATA = res.data;

  const hero = {
    eyebrow: getContentValue('hero', 'hero_eyebrow'),
    title: getContentValue('hero', 'hero_title'),
    description: getContentValue('hero', 'hero_description'),
    buttonText: getContentValue('hero', 'hero_button_text'),
    image: getContentValue('hero', 'hero_image')
  };
  const intro = {
    eyebrow: getContentValue('intro', 'intro_eyebrow'),
    title: getContentValue('intro', 'intro_title'),
    body1: getContentValue('intro', 'intro_body_1'),
    body2: getContentValue('intro', 'intro_body_2')
  };
  const footer = {
    tagline: getContentValue('footer', 'footer_tagline'),
    copyright: getContentValue('footer', 'copyright_text')
  };

  root.innerHTML = `
    <div class="page-head">
      <div><h2>Homepage</h2><p>Edit the sections that make up the alyf.site homepage. Changes publish immediately after saving.</p></div>
    </div>

    <div class="section-block">
      <h3>Hero Section</h3>
      <div class="desc">The first thing visitors see. Allowed formatting in the heading: line breaks and italics only.</div>
      <div class="field-row">
        <div class="field"><label>Eyebrow</label><input type="text" id="hero_eyebrow" value="${esc(hero.eyebrow ? hero.eyebrow.value : '')}"></div>
        <div class="field"><label>Button Text</label><input type="text" id="hero_button_text" value="${esc(hero.buttonText ? hero.buttonText.value : '')}"></div>
      </div>
      <div class="field-row single">
        <div class="field"><label>Main Heading (use &lt;br&gt; and &lt;em&gt; only)</label><textarea id="hero_title">${esc(hero.title ? hero.title.value : '')}</textarea></div>
      </div>
      <div class="field-row single">
        <div class="field"><label>Description</label><textarea id="hero_description">${esc(hero.description ? hero.description.value : '')}</textarea></div>
      </div>
      <div class="field-row single">
        <div class="field"><label>Hero Image</label>${imageFieldHtml('hero_image', hero.image ? hero.image.media_url : '', 'Hero image')}</div>
      </div>
      <div class="row-actions">
        <button class="btn btn-gold" id="saveHeroBtn">Save Changes</button>
      </div>
    </div>

    <div class="section-block">
      <h3>Introduction</h3>
      <div class="desc">The "Not just a room" section under the hero.</div>
      <div class="field-row">
        <div class="field"><label>Eyebrow</label><input type="text" id="intro_eyebrow" value="${esc(intro.eyebrow ? intro.eyebrow.value : '')}"></div>
      </div>
      <div class="field-row single">
        <div class="field"><label>Heading (use &lt;br&gt; and &lt;em&gt; only)</label><textarea id="intro_title">${esc(intro.title ? intro.title.value : '')}</textarea></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Paragraph 1</label><textarea id="intro_body_1">${esc(intro.body1 ? intro.body1.value : '')}</textarea></div>
        <div class="field"><label>Paragraph 2</label><textarea id="intro_body_2">${esc(intro.body2 ? intro.body2.value : '')}</textarea></div>
      </div>
      <div class="row-actions"><button class="btn btn-gold" id="saveIntroBtn">Save Changes</button></div>
    </div>

    <div class="section-block">
      <h3>Why ALYF (Features)</h3>
      <div class="desc">The numbered feature list. Add, edit, delete, reorder, or hide items.</div>
      <div id="featuresList"></div>
      <div class="row-actions"><button class="btn btn-ghost btn-sm" id="addFeatureBtn">+ Add Feature</button></div>
    </div>

    <div class="section-block">
      <h3>Footer</h3>
      <div class="field-row single">
        <div class="field"><label>Tagline</label><textarea id="footer_tagline">${esc(footer.tagline ? footer.tagline.value : '')}</textarea></div>
      </div>
      <div class="field-row single">
        <div class="field"><label>Copyright Text</label><input type="text" id="footer_copyright" value="${esc(footer.copyright ? footer.copyright.value : '')}"></div>
      </div>
      <div class="row-actions"><button class="btn btn-gold" id="saveFooterBtn">Save Changes</button></div>
    </div>
  `;

  bindImageField('hero_image', (info) => { PENDING_UPLOADS['hero_image'] = info; });

  document.getElementById('saveHeroBtn').addEventListener('click', () => saveHeroSection(hero));
  document.getElementById('saveIntroBtn').addEventListener('click', () => saveIntroSection(intro));
  document.getElementById('saveFooterBtn').addEventListener('click', () => saveFooterSection(footer));
  document.getElementById('addFeatureBtn').addEventListener('click', () => openFeatureEditor(null));

  renderFeaturesList(HOMEPAGE_DATA.features);
}

async function saveContentField(existingRow, section, key, type, value, extra) {
  const payload = Object.assign({
    id: existingRow ? existingRow.id : null,
    section, content_key: key, content_type: type, value,
    target_url: existingRow ? existingRow.target_url : '',
    alt_text: existingRow ? existingRow.alt_text : '',
    sort_order: existingRow ? existingRow.sort_order : 0,
    is_active: true
  }, extra || {});
  return gsRun('saveContent', getToken(), payload);
}

async function saveHeroSection(hero) {
  loadingDialog('Saving hero section…');
  try {
    // If a new image was selected, upload/replace it first so the CONTENT
    // row can be linked to the freshly published media.
    if (PENDING_UPLOADS['hero_image']) {
      const info = PENDING_UPLOADS['hero_image'];
      const existingMediaId = hero.image ? hero.image.media_id : null;
      const uploadRes = existingMediaId
        ? await gsRun('replaceImage', getToken(), existingMediaId, info.base64, info.mimeType, info.sizeBytes)
        : await gsRun('uploadImage', getToken(), info.base64, info.mimeType, info.sizeBytes, 'hero', 'Hero image');
      if (!handleApiResult(uploadRes, false)) return;
      await saveContentField(hero.image, 'hero', 'hero_image', 'image', '', { media_url: uploadRes.data.url, media_id: uploadRes.data.id });
      delete PENDING_UPLOADS['hero_image'];
    }

    const results = await Promise.all([
      saveContentField(hero.eyebrow, 'hero', 'hero_eyebrow', 'text', document.getElementById('hero_eyebrow').value),
      saveContentField(hero.title, 'hero', 'hero_title', 'html', document.getElementById('hero_title').value),
      saveContentField(hero.description, 'hero', 'hero_description', 'text', document.getElementById('hero_description').value),
      saveContentField(hero.buttonText, 'hero', 'hero_button_text', 'text', document.getElementById('hero_button_text').value)
    ]);
    const ok = results.every(r => r && r.success);
    handleApiResult(ok ? { success: true } : results.find(r => !r.success), 'Hero section published.');
    renderRoute('homepage');
  } catch (e) {
    Swal.close(); toast('error', 'Something went wrong. Please try again.');
  }
}

async function saveIntroSection(intro) {
  loadingDialog('Saving introduction…');
  try {
    const results = await Promise.all([
      saveContentField(intro.eyebrow, 'intro', 'intro_eyebrow', 'text', document.getElementById('intro_eyebrow').value),
      saveContentField(intro.title, 'intro', 'intro_title', 'html', document.getElementById('intro_title').value),
      saveContentField(intro.body1, 'intro', 'intro_body_1', 'text', document.getElementById('intro_body_1').value),
      saveContentField(intro.body2, 'intro', 'intro_body_2', 'text', document.getElementById('intro_body_2').value)
    ]);
    handleApiResult({ success: results.every(r => r && r.success) }, 'Introduction published.');
  } catch (e) { Swal.close(); toast('error', 'Something went wrong.'); }
}

async function saveFooterSection(footer) {
  loadingDialog('Saving footer…');
  try {
    const results = await Promise.all([
      saveContentField(footer.tagline, 'footer', 'footer_tagline', 'text', document.getElementById('footer_tagline').value),
      saveContentField(footer.copyright, 'footer', 'copyright_text', 'text', document.getElementById('footer_copyright').value)
    ]);
    handleApiResult({ success: results.every(r => r && r.success) }, 'Footer published.');
  } catch (e) { Swal.close(); toast('error', 'Something went wrong.'); }
}

// ---------- FEATURES (Why ALYF) CRUD ----------

function renderFeaturesList(features) {
  const list = document.getElementById('featuresList');
  const sorted = [...features].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  if (!sorted.length) { list.innerHTML = '<div class="empty-state">No features yet. Add one below.</div>'; return; }

  list.innerHTML = sorted.map(f => `
    <div class="list-item" data-id="${esc(f.id)}">
      <div class="list-item-head">
        <div><strong>${esc(f.number)} — ${esc(f.title)}</strong></div>
        <label class="toggle-row"><span class="switch"><input type="checkbox" class="feat-active" data-id="${esc(f.id)}" ${f.is_active ? 'checked' : ''}><span class="slider"></span></span> ${f.is_active ? 'Active' : 'Hidden'}</label>
      </div>
      <div style="font-size:12.5px;color:#726d66;margin-bottom:12px">${esc(f.description)}</div>
      <div class="row-actions">
        <button class="btn btn-ghost btn-sm feat-edit" data-id="${esc(f.id)}">Edit</button>
        <button class="btn btn-danger btn-sm feat-delete" data-id="${esc(f.id)}">Delete</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.feat-edit').forEach(btn => btn.addEventListener('click', () => {
    openFeatureEditor(features.find(f => f.id === btn.dataset.id));
  }));
  list.querySelectorAll('.feat-delete').forEach(btn => btn.addEventListener('click', async () => {
    const ok = await confirmDialog({ title: 'Delete this feature?', text: 'This action cannot be undone.', confirmText: 'Delete', icon: 'warning' });
    if (!ok) return;
    loadingDialog('Deleting…');
    const res = await gsRun('deleteFeature', getToken(), btn.dataset.id);
    if (handleApiResult(res, 'Feature deleted.')) renderRoute('homepage');
  }));
  list.querySelectorAll('.feat-active').forEach(cb => cb.addEventListener('change', async () => {
    const feature = features.find(f => f.id === cb.dataset.id);
    loadingDialog('Updating…');
    const res = await gsRun('saveFeature', getToken(), Object.assign({}, feature, { is_active: cb.checked }));
    handleApiResult(res, 'Updated.');
  }));
}

async function openFeatureEditor(feature) {
  const { value: formValues } = await Swal.fire({
    title: feature ? 'Edit Feature' : 'Add Feature',
    html: `
      <div style="text-align:left;font-family:'DM Sans',sans-serif">
        <label style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#726d66">Number</label>
        <input id="swal_number" class="swal2-input" style="margin:6px 0 14px" value="${esc(feature ? feature.number : '')}" placeholder="e.g. 01">
        <label style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#726d66">Title</label>
        <input id="swal_title" class="swal2-input" style="margin:6px 0 14px" value="${esc(feature ? feature.title : '')}">
        <label style="font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#726d66">Description</label>
        <textarea id="swal_desc" class="swal2-textarea" style="margin:6px 0">${esc(feature ? feature.description : '')}</textarea>
      </div>
    `,
    focusConfirm: false,
    showCancelButton: true,
    confirmButtonText: 'Save',
    confirmButtonColor: '#0b0b0b',
    preConfirm: () => ({
      number: document.getElementById('swal_number').value,
      title: document.getElementById('swal_title').value,
      description: document.getElementById('swal_desc').value
    })
  });
  if (!formValues) return;
  if (!formValues.title.trim()) { toast('error', 'Title is required.'); return; }

  loadingDialog('Saving feature…');
  const payload = Object.assign({}, feature, formValues);
  const res = await gsRun('saveFeature', getToken(), payload);
  if (handleApiResult(res, 'Feature saved.')) renderRoute('homepage');
}

// =========================================================================
// EXPERIENCE — the three "ALYF experience" cards
// =========================================================================

async function renderExperience(root) {
  const res = await gsRun('getHomepageContent', getToken());
  if (!handleApiResult(res, false)) { root.innerHTML = '<div class="empty-state">Unable to load experience cards.</div>'; return; }
  const items = [...res.data.experience].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

  root.innerHTML = `
    <div class="page-head">
      <div><h2>Experience</h2><p>Manage the three "ALYF experience" showcase cards on the homepage.</p></div>
    </div>
    <div id="expList"></div>
  `;

  const list = document.getElementById('expList');
  list.innerHTML = items.map(item => `
    <div class="section-block" data-id="${esc(item.id)}">
      <div class="list-item-head">
        <h3 style="font-size:20px">${esc(item.slot)}</h3>
        <label class="toggle-row"><span class="switch"><input type="checkbox" class="exp-active" ${item.is_active ? 'checked' : ''}><span class="slider"></span></span> ${item.is_active ? 'Active' : 'Hidden'}</label>
      </div>
      <div class="field-row">
        <div class="field"><label>Title / Label</label><input type="text" class="exp-title" value="${esc(item.title)}"></div>
        <div class="field"><label>Alt Text (for accessibility &amp; SEO)</label><input type="text" class="exp-alt" value="${esc(item.alt_text)}"></div>
      </div>
      <div class="field-row single">
        <div class="field"><label>Image</label>${imageFieldHtml('exp_' + item.id, item.image_url, item.alt_text)}</div>
      </div>

/** Minimal HTML5 drag-and-drop reordering for a list of .list-item elements. */
function bindDragReorder(container, itemSelector, onReorder) {
  let dragEl = null;
  container.querySelectorAll(itemSelector).forEach(el => {
    el.addEventListener('dragstart', () => { dragEl = el; el.style.opacity = '0.4'; });
    el.addEventListener('dragend', () => { el.style.opacity = '1'; });
    el.addEventListener('dragover', (e) => e.preventDefault());
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!dragEl || dragEl === el) return;
      const items = Array.from(container.querySelectorAll(itemSelector));
      const dragIdx = items.indexOf(dragEl);
      const dropIdx = items.indexOf(el);
      if (dragIdx < dropIdx) el.after(dragEl); else el.before(dragEl);
      const orderedIds = Array.from(container.querySelectorAll(itemSelector)).map(i => i.dataset.id);
      onReorder(orderedIds);
    });
  });
}

function renderMediaGrid() {

        </div>

  grid.querySelectorAll('.media-copy').forEach(btn => btn.addEventListener('click', () => {
    navigator.clipboard.writeText(btn.dataset.url).then(() => toast('success', 'URL copied.'));
  }));
  grid.querySelectorAll('.media-replace').forEach(btn => btn.addEventListener('click', () => openReplaceDialog(btn.dataset.id)));
  grid.querySelectorAll('.media-delete').forEach(btn => btn.addEventListener('click', () => confirmDeleteMedia(btn.dataset.id, btn.dataset.inuse === 'true')));
