<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidak ada koneksi — Personal Finance Pro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:flex;align-items:center;justify-content:center;min-height:100%;
    background:#071A33;color:#E4EEFB;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:24px;text-align:center;
  }
  .box{max-width:340px}
  .mark{
    width:64px;height:64px;border-radius:16px;margin:0 auto 20px;
    background:linear-gradient(135deg,#3A83DE,#0B8A5B);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:22px;color:#fff;letter-spacing:.02em;
  }
  h1{font-size:17px;margin-bottom:8px;font-weight:600}
  p{font-size:13.5px;color:#9FB4CF;line-height:1.6;margin-bottom:20px}
  button{
    padding:10px 18px;border-radius:8px;border:1px solid #3A83DE;background:transparent;
    color:#DCEBFF;font-size:13.5px;font-weight:500;cursor:pointer;
  }
  button:active{background:rgba(58,131,222,.15)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">PF</div>
    <h1>Tidak ada koneksi internet</h1>
    <p>Personal Finance Pro perlu terhubung ke internet untuk membaca dan menyimpan data di Google Sheets. Periksa koneksi Anda lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</body>
</html>
